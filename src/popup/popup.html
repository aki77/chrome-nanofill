<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nanofill</title>
    <link rel="stylesheet" href="./popup.css" />
  </head>
  <body>
    <main>
      <header>
        <h1>Nanofill</h1>
        <p class="subtitle">Fill the focused field with AI-generated dummy data.</p>
      </header>
      <section id="status-section" aria-live="polite">
        <div id="status-dot" class="dot dot--unknown"></div>
        <span id="status-text">Checking…</span>
      </section>
      <button id="fill-btn" type="button" disabled>Fill focused field</button>
      <p id="result" class="result" role="status"></p>
      <footer>
        <a href="chrome://on-device-internals" target="_blank" rel="noopener">
          Model status
        </a>
      </footer>
    </main>
    <script type="module" src="./popup.ts"></script>
  </body>
</html>
