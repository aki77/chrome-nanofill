<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a73e8"/>
      <stop offset="100%" stop-color="#1559b8"/>
    </linearGradient>
  </defs>

  <!-- background square with rounded corners -->
  <rect x="0" y="0" width="128" height="128" rx="24" ry="24" fill="url(#bg)"/>

  <!-- pen body (diagonal, bottom-left to top-right) -->
  <g transform="translate(64 64) rotate(-45) translate(-64 -64)">
    <!-- pen barrel -->
    <rect x="58" y="30" width="12" height="60" fill="#ffffff"/>
    <!-- pen tip (triangle pointing down) -->
    <polygon points="58,90 70,90 64,108" fill="#ffffff"/>
    <!-- ink dot at the very tip -->
    <circle cx="64" cy="110" r="3" fill="#0b3b78"/>
    <!-- cap accent at the top -->
    <rect x="58" y="22" width="12" height="10" rx="2" ry="2" fill="#fbbc04"/>
  </g>

  <!-- sparkle: four-point star (top-right) -->
  <g transform="translate(94 34)" fill="#fbbc04">
    <path d="M0 -16 L4 -4 L16 0 L4 4 L0 16 L-4 4 L-16 0 L-4 -4 Z"/>
  </g>
  <!-- smaller sparkle (top-right, offset) -->
  <g transform="translate(108 56)" fill="#fbbc04">
    <path d="M0 -7 L2 -2 L7 0 L2 2 L0 7 L-2 2 L-7 0 L-2 -2 Z"/>
  </g>
  <!-- tiny sparkle (bottom-left of pen) -->
  <g transform="translate(34 96)" fill="#fbbc04">
    <path d="M0 -5 L1.5 -1.5 L5 0 L1.5 1.5 L0 5 L-1.5 1.5 L-5 0 L-1.5 -1.5 Z"/>
  </g>
</svg>
